
  <!-- ================= Shared demo dialogs ================= -->
  <!-- Used by any <button data-demo-delete> in the template: it confirms first
       and offers an undo afterwards. -->
  <div class="modal fade" id="q-demo-confirm" tabindex="-1" aria-labelledby="q-demo-confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-6" id="q-demo-confirm-title" data-demo-title="Delete {name}?">Delete this record?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close dialog"></button>
        </div>
        <div class="modal-body">
          <p class="fs-7 text-muted-2 mb-0">
            <strong class="text-heading" data-slot="name"></strong>
            will be removed from the table. This is a front-end demo — press <strong>Undo</strong> on the confirmation to
            put it back.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-white" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" data-demo-confirm>Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Used by every "Add …" button: demo-ui.js builds the fields from the table
       the button points at, so a new list page needs no extra markup. -->
  <div class="modal fade" id="q-demo-record" tabindex="-1" aria-labelledby="q-demo-record-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form data-demo-form novalidate>
          <div class="modal-header">
            <h2 class="modal-title fs-6" id="q-demo-record-title" data-demo-title="Add record">Add record</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close dialog"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3" data-demo-record-fields></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-white" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" data-demo-submit>Add record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Opened by data-demo-import="#table": the pasted rows (or a chosen .csv
       file) become rows of that table, one record per line. -->
  <div class="modal fade" id="q-demo-import" tabindex="-1" aria-labelledby="q-demo-import-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-6" id="q-demo-import-title" data-demo-import-title>Import</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close dialog"></button>
        </div>
        <div class="modal-body">
          <p class="fs-8 text-muted-2">
            One record per line, in this column order:
            <span class="fw-600 text-heading" data-demo-import-columns></span>
          </p>
          <div class="mb-3">
            <label class="form-label" for="q-demo-import-file">Choose a .csv file</label>
            <input class="form-control" type="file" id="q-demo-import-file" accept=".csv,.txt,text/csv" data-demo-import-file>
          </div>
          <label class="form-label" for="q-demo-import-text">…or paste the rows here</label>
          <textarea class="form-control font-monospace fs-8" id="q-demo-import-text" rows="6" spellcheck="false"
                    data-demo-import-text placeholder="Northstar Labs,Enterprise,Negotiation,48000,AR"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-white" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" data-demo-import-run><i class="bi bi-upload"></i> Import rows</button>
        </div>
      </div>
    </div>
  </div>
